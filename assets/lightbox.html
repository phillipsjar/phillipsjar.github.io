<!-- A small full-screen image viewer. No library. It picks up any
     <a class="lightbox" data-gallery="..."> in the page, which is what
     scripts/prepare_photos.py writes.

     Zooming: click the photograph (or the Zoom button) to jump to full
     resolution and back, or use the zoom bar along the bottom to go anywhere
     from fitting the window up to five times full resolution. Scroll-wheel
     pinch (or ctrl/cmd + scroll) and two-finger pinch zoom too. Once zoomed,
     click and drag (or scroll, or swipe on a touchscreen) to move around. -->
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Photograph viewer">
  <button class="lb-zoom" type="button" aria-pressed="false" aria-label="Zoom in">Zoom in <span aria-hidden="true">&#43;</span></button>
  <button class="lb-close" type="button" aria-label="Close viewer">Close <span aria-hidden="true">&#10005;</span></button>
  <button class="lb-prev" type="button" aria-label="Previous photograph">&#8249;</button>
  <button class="lb-next" type="button" aria-label="Next photograph">&#8250;</button>
  <div class="lb-count" aria-hidden="true"></div>
  <!-- The stage is the same box whether or not the photograph is zoomed:
       zooming only changes the photograph's size inside it. -->
  <div class="lb-stage">
    <img class="lb-img" alt="" draggable="false">
  </div>
  <div class="lb-foot">
    <div class="lb-cap"></div>
    <div class="lb-zoombar" role="group" aria-label="Zoom">
      <button class="lb-zstep lb-zout" type="button" aria-label="Zoom out a step">&#8722;</button>
      <input class="lb-zrange" type="range" min="0" max="1000" step="1" value="0" aria-label="Zoom level">
      <button class="lb-zstep lb-zin" type="button" aria-label="Zoom in a step">&#43;</button>
      <span class="lb-zval">Fit</span>
    </div>
    <div class="lb-hint" aria-hidden="true">Esc or click the background to close &nbsp;·&nbsp; &#8592; &#8594; to browse</div>
  </div>
</div>

<script>
(function () {
  var box   = document.getElementById("lb");
  if (!box) return;
  var stage = box.querySelector(".lb-stage");
  var img   = box.querySelector(".lb-img");
  var cap   = box.querySelector(".lb-cap");
  var count = box.querySelector(".lb-count");
  var hint  = box.querySelector(".lb-hint");
  var zoomBtn = box.querySelector(".lb-zoom");
  var range = box.querySelector(".lb-zrange");
  var zval  = box.querySelector(".lb-zval");
  var foot  = box.querySelector(".lb-foot");
  var group = [], at = 0, opener = null;
  var coarsePointer = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;

  // Zoom levels. `scale` runs from 1 (fit to the window, the CSS default)
  // through `fullScale` (the photograph at its full saved resolution, one
  // image pixel per screen pixel -- scripts/prepare_photos.py saves them at
  // up to 1800px on the long edge) and on up to `maxScale`, OVERZOOM times
  // full resolution. Past full resolution there's no more detail, the pixels
  // just get bigger (and the browser smooths them), but it lets a reader blow
  // a small feature up to fill the screen. `fitW`/`fitH` are the size the
  // image renders at when scale is 1, measured fresh for each photograph.
  var OVERZOOM = 5;
  var scale = 1, minScale = 1, fullScale = 1, maxScale = 1, fitW = 0, fitH = 0;
  var EPS = 0.02;
  function isZoomed() { return scale > minScale + EPS; }

  function links(name) {
    return Array.prototype.slice.call(
      document.querySelectorAll('a.lightbox[data-gallery="' + name + '"]'));
  }

  function measureFit() {
    requestAnimationFrame(function () {
      if (isZoomed()) return;               // only meaningful at fit size
      fitW = img.clientWidth || 1;
      fitH = img.clientHeight || 1;
      var nW = img.naturalWidth || fitW, nH = img.naturalHeight || fitH;
      fullScale = Math.max(1, (nW / fitW) || 1, (nH / fitH) || 1);
      maxScale = fullScale * OVERZOOM;
      syncBar();
    });
  }

  // The zoom bar is logarithmic: equal distances along it are equal zoom
  // ratios, so the bit between "fit" and "full resolution" isn't squashed
  // into a sliver at one end.
  function scaleToBar(s) {
    if (maxScale <= minScale) return 0;
    return Math.round(1000 * Math.log(s / minScale) / Math.log(maxScale / minScale));
  }
  function barToScale(v) {
    return minScale * Math.pow(maxScale / minScale, v / 1000);
  }
  function syncBar() {
    range.value = scaleToBar(scale);
    var pct = Math.round(100 * scale / fullScale);
    zval.textContent = isZoomed() ? pct + "%" : "Fit";
    range.setAttribute("aria-valuetext",
      isZoomed() ? pct + "% of full resolution" : "Fit to window");
  }

  function setButtonLabel(zoomedNow) {
    zoomBtn.setAttribute("aria-pressed", zoomedNow ? "true" : "false");
    zoomBtn.setAttribute("aria-label", zoomedNow ? "Zoom out" : "Zoom in");
    zoomBtn.innerHTML = zoomedNow
      ? 'Zoom out <span aria-hidden="true">&#8722;</span>'
      : 'Zoom in <span aria-hidden="true">&#43;</span>';
  }

  // Applies a zoom level, keeping one point fixed on screen: whatever part of
  // the photograph is under (ax, ay) stays exactly there while the photograph
  // grows or shrinks around it. That point is the cursor for clicks and the
  // scroll wheel, the midpoint of the fingers for a pinch, and the middle of
  // the window for the zoom bar and buttons. Holding it still is what keeps
  // zooming from sliding the picture about.
  function setScale(next, ax, ay) {
    var clamped = Math.min(maxScale, Math.max(minScale, next));
    if (Math.abs(clamped - scale) < 0.001) { syncBar(); return; }
    if (ax == null) {
      var sr = stage.getBoundingClientRect();
      ax = sr.left + sr.width / 2;
      ay = sr.top + sr.height / 2;
    }
    var r0 = img.getBoundingClientRect();
    var fx = r0.width  ? Math.min(1, Math.max(0, (ax - r0.left) / r0.width))  : 0.5;
    var fy = r0.height ? Math.min(1, Math.max(0, (ay - r0.top)  / r0.height)) : 0.5;

    scale = clamped;
    var zoomedNow = isZoomed();
    box.classList.toggle("is-zoomed", zoomedNow);
    setButtonLabel(zoomedNow);
    if (zoomedNow) {
      img.style.width  = (fitW * scale) + "px";
      img.style.height = (fitH * scale) + "px";
      // Reading the new layout forces it to happen now, so the scroll
      // position can be set in the same frame as the resize: no in-between
      // frame where the picture has grown but not yet moved.
      var r1 = img.getBoundingClientRect(), s1 = stage.getBoundingClientRect();
      var left = r1.left - s1.left + stage.scrollLeft;   // image edge, in the
      var top  = r1.top  - s1.top  + stage.scrollTop;    // stage's scroll space
      stage.scrollLeft = left + fx * r1.width  - (ax - s1.left);
      stage.scrollTop  = top  + fy * r1.height - (ay - s1.top);
    } else {
      img.style.width = img.style.height = "";
      stage.scrollLeft = stage.scrollTop = 0;
    }
    syncBar();
  }

  function toggleZoom(e) {
    if (isZoomed()) return setScale(minScale);
    // Click goes to full resolution. If that's barely bigger than fitting
    // the window (a small original), double the size instead, so a click
    // always visibly zooms.
    var target = fullScale >= 1.25 ? fullScale : 2;
    if (e && e.target === img) setScale(target, e.clientX, e.clientY);
    else setScale(target);
  }

  function show(i) {
    scale = 1; minScale = 1; fullScale = 1; maxScale = 1;
    img.style.width = img.style.height = "";
    box.classList.remove("is-zoomed");
    setButtonLabel(false);
    syncBar();
    at = (i + group.length) % group.length;
    var a = group[at];
    var thumb = a.querySelector("img");
    img.onload = measureFit;
    img.src = a.getAttribute("href");
    if (img.complete) measureFit();
    img.alt = thumb ? thumb.getAttribute("alt") || "" : "";
    var fig = a.parentElement.querySelector("figcaption");   // from the grid tile
    cap.innerHTML = fig ? fig.innerHTML : "";
    count.textContent = group.length > 1 ? (at + 1) + " / " + group.length : "";
    // Pre-load the neighbours so arrowing through feels instant.
    [1, -1].forEach(function (d) {
      var n = group[(at + d + group.length) % group.length];
      if (n) { var p = new Image(); p.src = n.getAttribute("href"); }
    });
  }

  function open(a) {
    group = links(a.getAttribute("data-gallery"));
    if (!group.length) group = [a];
    opener = a;
    box.hidden = false;
    document.body.style.overflow = "hidden";
    hint.textContent = coarsePointer
      ? "Tap the photograph to zoom, or pinch or use the bar to zoom further"
      : "Esc or click the background to close  ·  ← → to browse  ·  click the photo or use the bar to zoom  ·  drag to move around";
    show(group.indexOf(a));
    box.querySelector(".lb-close").focus();
  }

  function close() {
    setScale(minScale);
    box.hidden = true;
    img.removeAttribute("src");
    document.body.style.overflow = "";
    if (opener) { opener.focus(); opener = null; }
  }

  document.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest("a.lightbox") : null;
    if (a) { e.preventDefault(); open(a); }
  });

  // The zoom bar. Dragging the slider zooms about the middle of the window;
  // the - and + buttons step by a quarter at a time.
  range.addEventListener("input", function () {
    setScale(barToScale(+range.value));
  });
  var STEP = 1.25;
  box.querySelector(".lb-zout").addEventListener("click", function () {
    setScale(scale / STEP);
  });
  box.querySelector(".lb-zin").addEventListener("click", function () {
    setScale(scale * STEP);
  });
  // From the keyboard, the arrow keys on the slider take the same steps as
  // the buttons (the slider's own steps are too fine to be any use there).
  range.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" || e.key === "ArrowUp") {
      e.preventDefault(); setScale(scale * STEP);
    } else if (e.key === "ArrowLeft" || e.key === "ArrowDown") {
      e.preventDefault(); setScale(scale / STEP);
    }
  });

  // Click and drag to move around a zoomed photograph. Mouse and pen only:
  // on a touchscreen a one-finger swipe already pans natively, because
  // .lb-stage is just a scrolling box. A press that moves more than a few
  // pixels counts as a drag, and the click the browser fires when it ends
  // is swallowed, so letting go after a drag doesn't also zoom back out.
  // (A drag on a photograph that isn't zoomed in has nothing to move, but it
  // still isn't a click, so it doesn't zoom in either.)
  var drag = null, justDragged = false;
  img.addEventListener("pointerdown", function (e) {
    justDragged = false;
    if (e.pointerType === "touch" || e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY, pan: isZoomed(),
             left: stage.scrollLeft, top: stage.scrollTop, moved: false };
    img.setPointerCapture(e.pointerId);
    e.preventDefault();                       // no text selection while dragging
  });
  img.addEventListener("pointermove", function (e) {
    if (!drag) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) > 4) {
      drag.moved = true;
      if (drag.pan) box.classList.add("is-dragging");
    }
    if (drag.moved && drag.pan) {
      stage.scrollLeft = drag.left - dx;
      stage.scrollTop  = drag.top  - dy;
    }
  });
  function endDrag() {
    if (!drag) return;
    justDragged = drag.moved;
    drag = null;
    box.classList.remove("is-dragging");
  }
  img.addEventListener("pointerup", endDrag);
  img.addEventListener("pointercancel", endDrag);

  box.addEventListener("click", function (e) {
    if (e.target.closest(".lb-zoombar")) return;      // handled above
    if (e.target.closest(".lb-close")) return close();
    if (e.target.closest(".lb-zoom"))  return toggleZoom();
    if (e.target === img && justDragged) { justDragged = false; return; }
    if (e.target === img)              return toggleZoom(e);
    if (e.target.closest(".lb-next"))  return show(at + 1);
    if (e.target.closest(".lb-prev"))  return show(at - 1);
    // A click on the bare backdrop closes: around the photograph, or the
    // empty space by the caption. Once zoomed in, the space around the
    // photograph doesn't, so a stray click while looking around can't lose
    // your place.
    if (e.target === box || e.target === foot ||
        (e.target === stage && !isZoomed())) close();
  });

  document.addEventListener("keydown", function (e) {
    if (box.hidden) return;
    if (e.key === "Escape")     { e.preventDefault(); close(); return; }
    // The slider uses the arrow keys itself, so they only browse when it
    // doesn't have focus.
    if (document.activeElement !== range) {
      if (!isZoomed() && e.key === "ArrowRight") { e.preventDefault(); show(at + 1); }
      if (!isZoomed() && e.key === "ArrowLeft")  { e.preventDefault(); show(at - 1); }
    }
    if (e.key === "Tab") {                       // keep focus inside the dialog
      var f = box.querySelectorAll("button, input");
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  // Trackpad pinch, and ctrl/cmd + scroll wheel (the desktop-browser
  // convention for "zoom"), zoom about the cursor -- browsers report both as
  // wheel events with ctrlKey set. A plain wheel keeps doing what it already
  // did: scrolling the stage to pan when zoomed.
  box.addEventListener("wheel", function (e) {
    if (box.hidden || !e.ctrlKey) return;
    e.preventDefault();
    setScale(scale * Math.exp(-e.deltaY * 0.0018), e.clientX, e.clientY);
  }, {passive: false});

  // Swiping browses between photographs, but only when not zoomed in --
  // while zoomed a one-finger swipe pans the image instead (the browser
  // handles that natively, since .lb-stage just scrolls). A two-finger
  // touch pinch-zooms about the midpoint of the fingers.
  var x0 = null;
  var pinch = null; // {dist, startScale}

  function touchDist(t) {
    var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  box.addEventListener("touchstart", function (e) {
    if (e.target.closest(".lb-zoombar")) { x0 = null; pinch = null; return; }
    if (e.touches.length === 2) {
      x0 = null;
      pinch = { dist: touchDist(e.touches), startScale: scale };
    } else {
      pinch = null;
      x0 = isZoomed() ? null : e.touches[0].clientX;
    }
  }, {passive: true});

  box.addEventListener("touchmove", function (e) {
    if (pinch && e.touches.length === 2) {
      e.preventDefault();
      var d = touchDist(e.touches);
      setScale(pinch.startScale * (d / pinch.dist),
               (e.touches[0].clientX + e.touches[1].clientX) / 2,
               (e.touches[0].clientY + e.touches[1].clientY) / 2);
    }
  }, {passive: false});

  box.addEventListener("touchend", function (e) {
    if (e.touches.length < 2) pinch = null;
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 50) show(at + (dx < 0 ? 1 : -1));
    x0 = null;
  }, {passive: true});

  // The window changing size (rotating a phone, say) changes what "fit"
  // means, so start that photograph over at fit.
  window.addEventListener("resize", function () {
    if (box.hidden) return;
    if (isZoomed()) setScale(minScale);
    measureFit();
  });
})();
</script>
